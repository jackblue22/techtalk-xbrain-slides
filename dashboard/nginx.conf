server {
  listen 80;
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $backend_upstream http://backend:8080;
  root /usr/share/nginx/html;
  index index.html;
  location /api/ { proxy_pass $backend_upstream; proxy_http_version 1.1; proxy_set_header X-Request-ID $request_id; proxy_no_cache 1; proxy_cache_bypass 1; }
  location /health { proxy_pass $backend_upstream; proxy_no_cache 1; }
  location /evidence/ { add_header Cache-Control "no-store" always; try_files $uri =404; }
  location / { try_files $uri /index.html; }
}
