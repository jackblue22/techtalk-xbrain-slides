services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hanoi_lab}
      POSTGRES_USER: ${POSTGRES_USER:-hanoi_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [lab]

  backend:
    build:
      context: .
      dockerfile: app/backend/Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-hanoi_app}:${POSTGRES_PASSWORD:-local-development-only}@db:5432/${POSTGRES_DB:-hanoi_lab}
      PORT: 8080
      HOST: 0.0.0.0
      APP_SCENARIO: local
      APP_VANTAGE: localhost-docker
      DB_LOCATION: local-docker
      AWS_REGION: ap-southeast-1
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [lab]

  frontend:
    build:
      context: .
      dockerfile: app/frontend/Dockerfile
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      backend:
        condition: service_healthy
    networks: [lab]

  agent:
    profiles: ["container-diagnostics"]
    build:
      context: .
      dockerfile: agent/Dockerfile
    environment:
      AGENT_HOST: 0.0.0.0
      AGENT_PORT: 3001
      AGENT_CONTAINER_DIAGNOSTICS: "1"
      AWS_REGION: ap-southeast-1
      AWS_PROFILE: ${AWS_PROFILE:-default}
    ports:
      - "127.0.0.1:3001:3001"
    networks: [lab]

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    ports:
      - "127.0.0.1:3000:80"
    volumes:
      - ./evidence:/usr/share/nginx/html/evidence:ro
    depends_on:
      backend:
        condition: service_healthy
    networks: [lab]

volumes:
  postgres-data:

networks:
  lab:
    driver: bridge
